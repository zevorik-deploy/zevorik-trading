name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            export PATH="/root/.bun/bin:$HOME/.bun/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "=== Deploying ZEVORIK ==="
            cd /root/zevorik-trading

            echo ">>> Git pull..."
            git fetch --all
            git reset --hard origin/main

            echo ">>> Installing dependencies..."
            bun install

            echo ">>> Force reset database..."
            npx prisma db push --force-reset --accept-data-loss

            echo ">>> Writing .env..."
            cat > .env << 'EOF'
DATABASE_URL=file:/home/z/my-project/db/custom.db
SMTP_HOST=smtp.hostinger.com
SMTP_PORT=465
SMTP_USER=zevorik@zevorik.com
SMTP_PASS=v=Z@/B:6q
EMAIL_FROM=ZEVORIK <zevorik@zevorik.com>
EOF

            echo ">>> Restarting app..."
            pkill -f "next dev" 2>/dev/null || true
            sleep 2
            nohup bun run dev > /tmp/zevorik.log 2>&1 &
            echo "Started PID: $!"
            sleep 5
            echo ">>> Checking status..."
            curl -s -o /dev/null -w "HTTP %{http_code}" http://localhost:3000/ || echo "Still starting..."
            echo ""
            echo "=== DEPLOYMENT COMPLETE ==="
