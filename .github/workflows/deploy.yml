name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            export PATH="$HOME/.bun/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

            # Load bun if installed
            if [ -f "$HOME/.bun/bin/bun" ]; then
              export BUN_INSTALL="$HOME/.bun"
              export PATH="$BUN_INSTALL/bin:$PATH"
            elif [ -f "/root/.bun/bin/bun" ]; then
              export BUN_INSTALL="/root/.bun"
              export PATH="$BUN_INSTALL/bin:$PATH"
            fi

            # Load nvm for pm2
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"

            echo "=== Deploying ZEVORIK ==="
            echo "Node: $(node -v 2>/dev/null || echo 'not found')"
            echo "Bun: $(bun -v 2>/dev/null || echo 'not found')"
            echo "PM2: $(pm2 -v 2>/dev/null || echo 'not found')"

            cd /root/zevorik-trading

            echo ">>> Git pull..."
            git pull origin main

            echo ">>> Installing dependencies..."
            if command -v bun &> /dev/null; then
              bun install
            else
              npm install
            fi

            echo ">>> Updating database..."
            if command -v bun &> /dev/null; then
              bun run db:push
            else
              npx prisma db push
            fi

            echo ">>> Restarting app..."
            if command -v pm2 &> /dev/null; then
              pm2 restart zevorik 2>/dev/null || pm2 start "bun run dev -- -p 3000" --name zevorik
              pm2 save
            elif command -v bun &> /dev/null; then
              # Kill existing process
              pkill -f "next dev" 2>/dev/null || true
              nohup bun run dev -- -p 3000 > /tmp/zevorik.log 2>&1 &
              echo "Started with PID: $!"
            else
              pkill -f "next dev" 2>/dev/null || true
              nohup npx next dev -p 3000 > /tmp/zevorik.log 2>&1 &
              echo "Started with PID: $!"
            fi

            echo "=== Deployment complete at $(date) ==="
