name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            export PATH="/root/.bun/bin:$HOME/.bun/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "=== Deploying ZEVORIK ==="
            cd /root/zevorik-trading

            echo ">>> Git pull..."
            git fetch --all
            git reset --hard origin/main

            echo ">>> Installing dependencies..."
            bun install

            echo ">>> Force reset database..."
            npx prisma db push --force-reset --accept-data-loss

            echo ">>> Writing .env..."
            printf 'DATABASE_URL=file:/home/z/my-project/db/custom.db\nSMTP_HOST=smtp.hostinger.com\nSMTP_PORT=465\nSMTP_USER=zevorik@zevorik.com\nSMTP_PASS=v=Z@/B:6q\nEMAIL_FROM=ZEVORIK <zevorik@zevorik.com>\n' > .env

            echo ">>> Creating restart script..."
            cat > /tmp/restart_zevorik.sh << 'RESTART'
            #!/bin/bash
            export PATH="/root/.bun/bin:$HOME/.bun/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            pkill -f "next-server" 2>/dev/null || true
            pkill -f "bun.*dev" 2>/dev/null || true
            sleep 2
            cd /root/zevorik-trading
            nohup bun run dev > /tmp/zevorik.log 2>&1 &
            echo "ZEVORIK restarted with PID $!" >> /tmp/zevorik_restart.log
            RESTART
            chmod +x /tmp/restart_zevorik.sh

            echo ">>> Scheduling restart..."
            nohup /tmp/restart_zevorik.sh > /dev/null 2>&1 &
            disown

            echo "=== Code deployed. App restarting in background... ==="
