name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          port: 22
          timeout: 120s
          command_timeout: 15m
          script: |
            export PATH=/root/.bun/bin:/usr/local/bin:/usr/bin:/bin:$HOME/.bun/bin:$PATH
            cd /root/zevorik-trading
            git fetch --all
            git reset --hard origin/main
            bun install
            cat > .env << 'ENVEOF'
DATABASE_URL=file:./db/custom.db
SMTP_HOST=smtp.hostinger.com
SMTP_PORT=465
SMTP_USER=zevorik@zevorik.com
SMTP_PASS=v=Z@/B:6q
EMAIL_FROM=ZEVORIK <zevorik@zevorik.com>
JWT_SECRET=zevorik-jwt-secret-key-2024-secure
ENVEOF
            npx prisma db push --accept-data-loss
            pkill -f next-server 2>/dev/null || true
            pkill -f "next start" 2>/dev/null || true
            pkill -f "next dev" 2>/dev/null || true
            sleep 2
            cd /root/zevorik-trading
            setsid bun run dev > /tmp/zevorik.log 2>&1 &
            sleep 8
            curl -s http://localhost:3000/api/stocks > /dev/null && echo "App running!" || echo "App starting..."
