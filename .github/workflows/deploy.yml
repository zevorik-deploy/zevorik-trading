name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          port: 22
          command_timeout: 10m
          script_stop: true
          script: |
            export PATH="$HOME/.bun/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

            # Load bun
            if [ -f "$HOME/.bun/bin/bun" ]; then
              export BUN_INSTALL="$HOME/.bun"
              export PATH="$BUN_INSTALL/bin:$PATH"
            elif [ -f "/root/.bun/bin/bun" ]; then
              export BUN_INSTALL="/root/.bun"
              export PATH="$BUN_INSTALL/bin:$PATH"
            fi

            # Load nvm
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "=== Deploying ZEVORIK ==="
            echo "Bun: $(bun -v 2>/dev/null || echo 'not found')"

            cd /root/zevorik-trading

            echo ">>> Git pull..."
            git pull origin main

            echo ">>> Installing dependencies..."
            bun install

            echo ">>> Updating database (force reset)..."
            npx prisma db push --force-reset

            # Write .env file with SMTP config
            cat > .env << 'ENVEOF'
DATABASE_URL=file:/home/z/my-project/db/custom.db

# SMTP Email Configuration (Hostinger)
SMTP_HOST=smtp.hostinger.com
SMTP_PORT=465
SMTP_USER=zevorik@zevorik.com
SMTP_PASS=v=Z@/B:6q
EMAIL_FROM=ZEVORIK <zevorik@zevorik.com>
ENVEOF
            echo ">>> .env configured"

            echo ">>> Restarting app..."
            pkill -f "next dev" 2>/dev/null || true
            sleep 2
            nohup bun run dev > /tmp/zevorik.log 2>&1 &
            echo "Started with PID: $!"
            sleep 3
            echo "=== Deployment complete at $(date) ==="
