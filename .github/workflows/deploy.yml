name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            export PATH="/root/.bun/bin:$HOME/.bun/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            echo "=== Deploying ZEVORIK ==="
            cd /root/zevorik-trading

            echo ">>> Git pull..."
            git fetch --all
            git reset --hard origin/main

            echo ">>> Installing dependencies..."
            bun install

            echo ">>> Pushing database schema..."
            npx prisma db push --accept-data-loss

            echo ">>> Writing .env..."
            cat > .env << 'ENVEOF'
            DATABASE_URL=file:./db/custom.db
            SMTP_HOST=smtp.hostinger.com
            SMTP_PORT=465
            SMTP_USER=zevorik@zevorik.com
            SMTP_PASS=v=Z@/B:6q
            EMAIL_FROM=ZEVORIK <zevorik@zevorik.com>
            ENVEOF

            echo ">>> Restarting application..."
            pkill -f "next-server" 2>/dev/null || true
            pkill -f "next dev" 2>/dev/null || true
            pkill -f "bun.*dev" 2>/dev/null || true
            sleep 2
            cd /root/zevorik-trading
            nohup bun run dev > /tmp/zevorik.log 2>&1 &
            echo "ZEVORIK restarted with PID $!"

            sleep 5
            echo "=== Deployment complete! ==="
            echo "Website: https://zevorik.com"
